site_name: fabric-data-pipelines
site_description: Author Microsoft Fabric data pipelines as typed Python code.
site_url: https://fabric-data-pipelines.datalyft.io/
repo_url: https://github.com/datalyft/fabric-data-pipelines
repo_name: datalyft/fabric-data-pipelines
docs_dir: docs
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  font:
    text: Manrope
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            show_root_toc_entry: true
            separate_signature: true
            show_signature_annotations: true
            show_source: false
            members_order: source
            filters:
              - "!^_"
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/datalyft/fabric-data-pipelines
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fabric-data-pipelines/
      name: PyPI
    - icon: fontawesome/solid/globe
      link: https://datalyft.io
      name: datalyft
copyright: Sponsored by <a href="https://datalyft.io" target="_blank" rel="noopener">datalyft</a>
nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Concepts:
      - Activities: concepts/activities.md
      - Dependencies: concepts/dependencies.md
      - Expressions: concepts/expressions.md
      - Exporting: concepts/exporting.md
      - Importing: concepts/importing.md
  - Guides:
      - Scheduling: guides/scheduling.md
      - ETL Patterns: guides/etl-patterns.md
      - Deploy to Fabric: guides/deploy.md
      - Migrate from Fabric: guides/migrate.md
      - CI with GitHub Actions: guides/ci.md
      - How this compares: guides/positioning.md
  - Reference:
      - Overview: reference/index.md
      - Pipeline: reference/pipeline.md
      - Activities:
          - Base: reference/activities/base.md
          - Control Flow: reference/activities/control.md
          - Data Movement: reference/activities/data-movement.md
          - Execution: reference/activities/execution.md
          - Variables: reference/activities/variables.md
          - Raw: reference/activities/raw.md
      - Expressions: reference/expressions.md
      - Schedules: reference/schedules.md
      - Export: reference/export.md
      - Import: reference/import.md
      - Errors: reference/errors.md
      - Changelog: reference/changelog.md
